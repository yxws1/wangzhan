<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态内容显示器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.6s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .content-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 30px;
            border-radius: 10px;
            min-height: 200px;
            font-size: 1.3em;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .loading {
            text-align: center;
            color: #999;
            font-style: italic;
        }
        
        .error {
            color: #e74c3c;
            text-align: center;
        }
        
        .refresh-btn {
            margin-top: 20px;
            text-align: center;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .timestamp {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 内容展示器</h1>
        <div id="content" class="content-box loading">
            正在加载内容...
        </div>
        <div class="refresh-btn">
            <button onclick="loadContent()">🔄 刷新内容</button>
        </div>
        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        function loadContent() {
            const timestamp = new Date().getTime();
            fetch('content.txt?t=' + timestamp)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('无法读取文件');
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('content').innerHTML = data || '(文件为空)';
                    document.getElementById('content').className = 'content-box';
                    updateTimestamp();
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = '❌ 读取失败：' + error.message;
                    document.getElementById('content').className = 'content-box error';
                });
        }
        
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                '最后更新：' + now.toLocaleString('zh-CN');
        }
        
        loadContent();
    </script>
</body>
</html>
