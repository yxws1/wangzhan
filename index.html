<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI交互任务管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            height: 100vh;
            display: flex;
            padding: 20px;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        
        /* 左侧区域 - 占1/3 */
        .left-panel {
            width: 33.33%;
            display: flex;
            flex-direction: column;
            padding-right: 15px;
            height: 100%;
        }
        
        /* 词条列表区域 - 占6/7 */
        .item-list {
            flex: 6;
            background-color: white;
            border-radius: 8px;
            padding: 20px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .item {
            display: flex;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #fafafa;
            flex-shrink: 0;
        }
        
        .item:hover {
            border-color: #1890ff;
            background-color: #f0f8ff;
        }
        
        .item.selected {
            border-color: #1890ff;
            background-color: #e6f7ff;
            box-shadow: 0 0 8px rgba(24, 144, 255, 0.3);
        }
        
        .item-number {
            width: 10%;
            min-width: 30px;
            font-weight: bold;
            color: #1890ff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .item-content {
            flex: 1;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-left: 15px;
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        
        .item-content.empty {
            color: #ccc;
            font-style: italic;
        }
        
        /* 左侧空白区域 */
        .left-spacer {
            flex: 1;
        }
        
        /* 右侧区域 - 占2/3 */
        .right-panel {
            width: 66.67%;
            display: flex;
            flex-direction: column;
            padding-left: 15px;
            height: 100%;
        }
        
        /* 输入区域 - 占3/4 */
        .input-area {
            flex: 3;
            display: flex;
            flex-direction: column;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        
        textarea {
            flex: 1;
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            border-color: #1890ff;
        }
        
        /* 按钮区域 */
        .button-area {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-clear {
            background-color: #ff4d4f;
            color: white;
        }
        
        .btn-clear:hover:not(:disabled) {
            background-color: #ff7875;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3);
        }
        
        .btn-save {
            background-color: #52c41a;
            color: white;
        }
        
        .btn-save:hover:not(:disabled) {
            background-color: #73d13d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(82, 196, 26, 0.3);
        }
        
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        
        /* 状态区域 - 占1/4 */
        .status-area {
            flex: 1;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .status-text {
            padding: 10px 20px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .status-success {
            background-color: #f6ffed;
            color: #52c41a;
            border: 2px solid #b7eb8f;
        }
        
        .status-info {
            background-color: #e6f7ff;
            color: #1890ff;
            border: 2px solid #91d5ff;
        }
        
        .status-warning {
            background-color: #fff7e6;
            color: #fa8c16;
            border: 2px solid #ffd591;
        }
        
        .status-empty {
            color: #999;
        }

        .loading {
            color: #1890ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="item-list" id="itemList"></div>
        <div class="left-spacer"></div>
    </div>
    
    <div class="right-panel">
        <div class="input-area">
            <textarea 
                id="textInput" 
                placeholder="请输入内容（最多10000字）..." 
                maxlength="10000"
            ></textarea>
            <div class="button-area">
                <button class="btn-clear" id="btnClear" onclick="clearText()">清除</button>
                <button class="btn-save" id="btnSave" onclick="saveText()">保存</button>
            </div>
        </div>
        
        <div class="status-area">
            <div class="status-text status-empty" id="statusText">正在加载...</div>
        </div>
    </div>

    <script>
        // ========== 配置区域 - 请修改token ==========
        const CONFIG = {
            owner: 'yxws1',
            repo: 'wangzhan',
            filePath: 'data.json',
            token: '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'  // ← 把这里改成你的token
        };
        // ==========================================

        let items = [];
        let selectedIndex = 0;
        let maxItems = 12;

        // 计算可以容纳的最大词条数量
        function calculateMaxItems() {
            const itemList = document.getElementById('itemList');
            const listHeight = itemList.clientHeight;
            const padding = 40;
            const availableHeight = listHeight - padding;
            const itemHeight = 52;
            const itemMargin = 8;
            const count = Math.floor((availableHeight + itemMargin) / (itemHeight + itemMargin));
            return Math.max(1, count);
        }

        // 从GitHub加载数据（使用raw链接）
        async function loadFromGitHub() {
            try {
                showStatus('正在加载数据...', 'info');
                setButtonsEnabled(false);

                const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/main/${CONFIG.filePath}`;
                console.log('请求URL:', url);
                
                const response = await fetch(url, {
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error('无法加载数据文件');
                }

                const jsonData = await response.json();
                items = jsonData.items || [];
                
                // 确保items数组长度符合maxItems
                while (items.length < maxItems) {
                    items.push('');
                }
                if (items.length > maxItems) {
                    items = items.slice(0, maxItems);
                }

                renderItems();
                loadItemContent(0);
                showStatus('加载成功！', 'success');
                setButtonsEnabled(true);

            } catch (error) {
                console.error('加载失败:', error);
                showStatus('加载失败: ' + error.message, 'warning');
                // 失败时使用空数据
                items = Array(maxItems).fill('');
                renderItems();
                loadItemContent(0);
                setButtonsEnabled(true);
            }
        }

        // 保存到GitHub
        async function saveToGitHub() {
            try {
                showStatus('正在保存到GitHub...', 'info');
                setButtonsEnabled(false);

                // 先获取当前文件的SHA
                const getUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.filePath}`;
                console.log('获取文件信息:', getUrl);
                
                const getResponse = await fetch(getUrl, {
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!getResponse.ok) {
                    const errorData = await getResponse.json();
                    throw new Error(errorData.message || '无法获取文件信息');
                }

                const fileData = await getResponse.json();
                const sha = fileData.sha;

                // 保存数据
                const content = JSON.stringify({ items: items }, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(content)));

                const putUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.filePath}`;
                const response = await fetch(putUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update data - ${new Date().toLocaleString('zh-CN')}`,
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '保存失败');
                }

                showStatus('保存成功！', 'success');
                setButtonsEnabled(true);
                return true;

            } catch (error) {
                console.error('保存失败:', error);
                showStatus('保存失败: ' + error.message, 'warning');
                setButtonsEnabled(true);
                return false;
            }
        }

        // 页面加载时初始化
        window.onload = async function() {
            maxItems = calculateMaxItems();
            console.log(`可容纳词条数量: ${maxItems}`);
            await loadFromGitHub();
        };

        // 窗口大小改变时重新计算
        window.onresize = function() {
            const newMaxItems = calculateMaxItems();
            if (newMaxItems !== maxItems) {
                maxItems = newMaxItems;
                
                if (items.length < maxItems) {
                    while (items.length < maxItems) {
                        items.push('');
                    }
                } else if (items.length > maxItems) {
                    items = items.slice(0, maxItems);
                    if (selectedIndex >= maxItems) {
                        selectedIndex = maxItems - 1;
                    }
                }
                
                renderItems();
                loadItemContent(selectedIndex);
            }
        };

        // 渲染词条列表
        function renderItems() {
            const itemList = document.getElementById('itemList');
            itemList.innerHTML = '';
            
            for (let i = 0; i < maxItems; i++) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item' + (i === selectedIndex ? ' selected' : '');
                itemDiv.onclick = () => selectItem(i);
                
                const numberDiv = document.createElement('div');
                numberDiv.className = 'item-number';
                numberDiv.textContent = (i + 1);
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'item-content' + (items[i] ? '' : ' empty');
                contentDiv.textContent = items[i] ? items[i].substring(0, 30) + (items[i].length > 30 ? '...' : '') : '空';
                
                itemDiv.appendChild(numberDiv);
                itemDiv.appendChild(contentDiv);
                itemList.appendChild(itemDiv);
            }
        }

        // 选择词条
        function selectItem(index) {
            selectedIndex = index;
            renderItems();
            loadItemContent(index);
        }

        // 加载词条内容到输入框1
        function loadItemContent(index) {
            document.getElementById('textInput').value = items[index] || '';
        }

        // 保存文本
        async function saveText() {
            const text = document.getElementById('textInput').value.trim();
            
            if (text.length === 0) {
                showStatus('请输入内容后再保存', 'info');
                return;
            }
            
            if (text.length > 10000) {
                showStatus('内容超过10000字限制', 'info');
                return;
            }
            
            items[selectedIndex] = text;
            renderItems();
            
            // 保存到GitHub
            await saveToGitHub();
        }

        // 清除文本
        async function clearText() {
            if (items[selectedIndex] === '') {
                showStatus('当前词条已经是空的', 'info');
                return;
            }
            
            items[selectedIndex] = '';
            document.getElementById('textInput').value = '';
            renderItems();
            
            // 保存到GitHub
            const saved = await saveToGitHub();
            if (saved) {
                showStatus('清除成功！', 'success');
            }
        }

        // 显示状态
        function showStatus(message, type) {
            const statusText = document.getElementById('statusText');
            statusText.textContent = message;
            statusText.className = 'status-text status-' + type;
            
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    statusText.textContent = '等待操作...';
                    statusText.className = 'status-text status-empty';
                }, 3000);
            }
        }

        // 启用/禁用按钮
        function setButtonsEnabled(enabled) {
            document.getElementById('btnSave').disabled = !enabled;
            document.getElementById('btnClear').disabled = !enabled;
        }
    </script>
</body>
</html>
