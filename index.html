<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>极客导航</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Microsoft YaHei",sans-serif;min-height:100vh;color:#243b53;background:linear-gradient(135deg,#eaf6ff,#ffffff,#dff3ff)}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(79,172,254,.25),transparent 35%),radial-gradient(circle at 80% 70%,rgba(0,242,254,.2),transparent 35%);z-index:-1}
.header{position:sticky;top:0;padding:20px;background:rgba(255,255,255,.65);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,120,255,.12)}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;gap:25px;flex-wrap:wrap}.logo{font-size:30px;font-weight:800;color:#1687ff}.search{flex:1;min-width:250px;padding:15px 25px;border-radius:40px;border:1px solid #cfe8ff;background:white;font-size:16px;outline:none;box-shadow:0 10px 30px rgba(0,100,200,.08)}
.container{max-width:1200px;margin:auto;padding:40px 20px}.title{font-size:28px;margin:35px 0 20px;color:#1769aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}.card{display:block;text-decoration:none;color:#234;background:rgba(255,255,255,.65);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:30px;text-align:center;box-shadow:0 15px 40px rgba(0,100,200,.08);transition:.3s}.card:hover{transform:translateY(-8px);box-shadow:0 25px 50px rgba(0,130,255,.18)}.icon{font-size:40px;margin-bottom:15px;color:#1687ff}.name{font-size:18px;font-weight:700}.desc{font-size:13px;color:#718096;margin-top:8px}
</style>
</head>
<body>
<header class="header"><div class="top"><div class="logo">🚀 极客导航</div><input class="search" id="search" placeholder="搜索网站..."></div></header>
<div class="container"><h2 class="title">常用网站</h2><div class="grid" id="grid">
<a class="card" href="https://github.com"><div class="icon">💻</div><div class="name">GitHub</div><div class="desc">代码托管平台</div></a>
<a class="card" href="https://www.baidu.com"><div class="icon">🔍</div><div class="name">百度</div><div class="desc">中文搜索</div></a>
<a class="card" href="https://www.google.com"><div class="icon">🌐</div><div class="name">Google</div><div class="desc">全球搜索</div></a>
<a class="card" href="https://www.bilibili.com"><div class="icon">📺</div><div class="name">哔哩哔哩</div><div class="desc">视频社区</div></a>
<a class="card" href="https://chat.openai.com"><div class="icon">🤖</div><div class="name">AI助手</div><div class="desc">智能工具</div></a>
<a class="card" href="https://www.aliyun.com"><div class="icon">☁️</div><div class="name">阿里云</div><div class="desc">云计算服务</div></a>
</div></div>
<script>document.getElementById('search').oninput=function(){let v=this.value.toLowerCase();document.querySelectorAll('.card').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(v)?'block':'none')}</script>
</body>
</html>
